name: Refresh videos and articles

on:
  schedule:
    # GitHub often delays or drops scheduled runs, so try every hour from 03:17 to 12:17 UTC.
    # The "check" job below skips the work once a run has already succeeded today.
    - cron: "17 3-12 * * *"
  workflow_dispatch: {}      # "Run workflow" button in the Actions tab
  repository_dispatch:       # started by the nightly cloud routine (needs only contents permission)
    types: [refresh]

permissions:
  contents: write
  actions: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  # Scheduled runs only: skip if this workflow already succeeded today (UTC). Manual runs always go ahead.
  check:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.today.outputs.done }}
    steps:
      - id: today
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list -R "$GITHUB_REPOSITORY" --workflow refresh.yml --status success \
                --created ">=$(date -u +%F)" --json databaseId --jq length)
          echo "Successful runs today: $n"
          if [ "$n" -gt 0 ]; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi

  refresh:
    needs: check
    if: always() && needs.check.outputs.done != 'true' && needs.check.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Embeddings and fetched article pages are cached between runs, so only new items are processed
      - uses: actions/cache@v4
        with:
          path: .cache
          key: nerdvana-${{ github.run_id }}
          restore-keys: |
            nerdvana-
            embeddings-

      - name: Keep the current data for comparison
        run: cp videos.json /tmp/videos.prev.json && cp articles.json /tmp/articles.prev.json

      - name: Fetch all channels and rebuild videos.json
        run: python3 fetch.py --force

      - name: Fetch all article sources and rebuild articles.json
        run: python3 articles.py

      # If a source blocks the runner (YouTube often does), much of the data comes back empty.
      # Keep the live version of that file instead of publishing a shrunken one.
      - name: Sanity check
        run: |
          python3 - <<'PY'
          import json, subprocess
          def check(path, prev, groups, items, min_groups):
              old, new = json.load(open(prev)), json.load(open(path))
              og, ng, oi, ni = len(old[groups]), len(new[groups]), len(old[items]), len(new[items])
              print(f"{path}: {groups} {og} -> {ng}, {items} {oi} -> {ni}")
              if ng < min(min_groups, og) or ni < 0.9 * oi:
                  print(f"::warning::{path} looks incomplete (a source may be blocking the runner); keeping the live version.")
                  subprocess.run(["cp", prev, path], check=True)
          check("videos.json", "/tmp/videos.prev.json", "channels", "videos", 95)
          check("articles.json", "/tmp/articles.prev.json", "sources", "articles", 110)
          PY

      - name: Rebuild "More like this", learning and reading paths, and video/article links
        run: uv run --no-project --python 3.12 --with fastembed --with numpy python enrich.py

      - name: Write feed.xml (this week's top videos and articles)
        run: python3 feed.py

      - name: Commit if anything changed
        run: |
          FILES="videos.json similar.json paths.json articles.json similar_articles.json links.json reading_paths.json feed.xml courses.json path_candidates.json"
          if git diff --quiet $FILES; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Refresh videos and articles ($(date -u +%Y-%m-%d))"
          git pull --rebase   # someone (or the morning transcripts run) may have pushed meanwhile
          git push
