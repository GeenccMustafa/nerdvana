name: Refresh transcripts

# Weekly: download subtitles for new videos from the Essential channels and rebuild search.json.
# The transcripts themselves stay in the (private) Actions cache, shared with the nightly job,
# which keeps the cache fresh. Only the compact word index, search.json, is committed.
on:
  schedule:
    - cron: "41 4 * * 0"   # Sundays at 04:41 UTC, after the nightly refresh
  workflow_dispatch:
    inputs:
      max_new:
        description: "Most transcripts to download in this run"
        default: "600"

permissions:
  contents: write

concurrency:
  group: refresh            # never at the same time as the nightly job: both commit to main and share the cache
  cancel-in-progress: false

jobs:
  transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRANSCRIPTS_DIR: .cache/transcripts
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/cache@v4
        with:
          path: .cache
          key: nerdvana-${{ github.run_id }}
          restore-keys: nerdvana-

      - name: Download new transcripts and rebuild search.json
        run: |
          mkdir -p "$TRANSCRIPTS_DIR"
          echo "transcripts on hand: $(ls "$TRANSCRIPTS_DIR" | wc -l)"
          cp search.json /tmp/search.prev.json
          MAX_NEW="${{ inputs.max_new || '600' }}" python3 transcripts.py

      # If YouTube blocked the runner (or the cache was lost) the index could shrink: keep the live one.
      # The job still succeeds, so whatever was downloaded is cached and the next run builds on it.
      - name: Sanity check
        run: |
          python3 - <<'PY'
          import json, shutil
          old, new = json.load(open("/tmp/search.prev.json")), json.load(open("search.json"))
          print(f"transcripts in the index: {len(old['docs'])} -> {len(new['docs'])}")
          if len(new["docs"]) < len(old["docs"]):
              print("::warning::The new index is smaller than the live one; keeping the live version.")
              shutil.copy("/tmp/search.prev.json", "search.json")
          PY

      - name: Commit if anything changed
        run: |
          if git diff --quiet search.json; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.json
          git commit -m "Refresh transcripts ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
