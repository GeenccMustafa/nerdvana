name: Refresh transcripts

# Weekly: download subtitles for new videos from the Essential channels and rebuild search.json.
# The transcripts/ folder (~40 MB) lives in the "transcripts-data" release instead of git history.
on:
  schedule:
    - cron: "41 4 * * 0"   # Sundays at 04:41 UTC, after the nightly refresh
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh            # never at the same time as the nightly job, both commit to main
  cancel-in-progress: false

jobs:
  transcripts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Restore the transcripts collected so far
        run: |
          gh release download transcripts-data --pattern transcripts.tar.gz --dir /tmp
          tar xzf /tmp/transcripts.tar.gz
          echo "transcripts on hand: $(ls transcripts | wc -l)"
          cp search.json /tmp/search.prev.json

      - name: Download new transcripts and rebuild search.json
        run: MAX_NEW=600 python3 transcripts.py

      # If YouTube blocked the runner nothing new comes in; never publish a smaller index
      - name: Sanity check
        run: |
          python3 - <<'PY'
          import json, sys
          old, new = json.load(open("/tmp/search.prev.json")), json.load(open("search.json"))
          print(f"transcripts in the index: {len(old['docs'])} -> {len(new['docs'])}")
          if len(new["docs"]) < len(old["docs"]):
              sys.exit("The new index is smaller than the live one; keeping the live version.")
          PY

      - name: Save the transcripts for next week
        run: |
          tar czf /tmp/transcripts.tar.gz transcripts
          gh release upload transcripts-data /tmp/transcripts.tar.gz --clobber

      - name: Commit if anything changed
        run: |
          if git diff --quiet search.json; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search.json
          git commit -m "Refresh transcripts ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
