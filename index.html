<style>
/* Layout: sticky control bar over a sidebar (tiers + channels) and an auto-fill thumbnail grid; watch view and TV mode are full-screen layers. */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --raise: #e8ebf1; --line: #d5dae4;
  --fg: #141a26; --fg2: #5a6478; --accent: #c9761a; --accent-fg: #ffffff;
  --tS: #c43d4b; --tA: #c9761a; --tB: #2f7d6d;
  --shade: rgba(10, 14, 22, .55);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10141d; --surface: #171c27; --raise: #212836; --line: #2b3343;
  --fg: #eceff5; --fg2: #96a0b4; --accent: #f2a93b; --accent-fg: #171107;
  --tS: #ff7a85; --tA: #f2a93b; --tB: #5ccdb4; --shade: rgba(0,0,0,.7); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #171c27; --raise: #212836; --line: #2b3343;
  --fg: #eceff5; --fg2: #96a0b4; --accent: #f2a93b; --accent-fg: #171107;
  --tS: #ff7a85; --tA: #f2a93b; --tB: #5ccdb4; --shade: rgba(0,0,0,.7); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }

header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font: 800 26px/1 var(--display); letter-spacing: -.02em; margin: 0; }
.brand h1 span { color: var(--accent); }
.brand small { font: 12px var(--mono); color: var(--fg2); font-variant-numeric: tabular-nums; }
.search { flex: 1 1 280px; max-width: 520px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 14px; }
.search input { border: 0; background: transparent; outline: none; height: 38px; width: 100%; min-width: 0; }
.search kbd { font: 11px var(--mono); color: var(--fg2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.actions { display: flex; gap: 8px; }
.btn { height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn:hover { border-color: var(--fg2); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.icon-btn { width: 38px; padding: 0; justify-content: center; }

.filters { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; padding-block: 0 12px; }
.group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.group > b { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--fg2); margin-right: 2px; }
.chip { height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip:hover { background: var(--raise); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { font: 11px var(--mono); opacity: .65; font-variant-numeric: tabular-nums; }
.tier { font: 600 11px var(--mono); width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; color: #fff; flex: none; }
.tier.S { background: var(--tS); } .tier.A { background: var(--tA); } .tier.B { background: var(--tB); }
select.chip { padding-right: 8px; }

/* Sidebar: nav + channels grouped by tier. Sticky column on desktop, slide-in drawer below 1000px. */
.layout { display: grid; grid-template-columns: 252px minmax(0, 1fr); max-width: 1680px; margin: 0 auto; }
.side { position: sticky; top: var(--hh, 112px); height: calc(100vh - var(--hh, 112px)); overflow-y: auto; padding: 14px 10px 40px max(10px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); scrollbar-width: thin; }
.nav-item, .ch-item { width: 100%; display: flex; align-items: center; gap: 12px; border: 0; background: none; text-align: left; border-radius: 10px; min-width: 0; }
.nav-item { height: 40px; padding: 0 12px; font-weight: 500; }
.nav-item svg { flex: none; color: var(--fg2); }
.nav-item .n { margin-left: auto; font: 11px var(--mono); color: var(--fg2); font-variant-numeric: tabular-nums; }
.nav-item:hover, .ch-item:hover { background: var(--raise); }
.nav-item[aria-current="true"], .ch-item[aria-current="true"] { background: var(--raise); font-weight: 600; }
.nav-item[aria-current="true"] svg { color: var(--accent); }
.side hr { border: 0; border-top: 1px solid var(--line); margin: 12px 4px; }
.tier-head { width: 100%; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 14px 12px 6px; font: 700 14px var(--display); letter-spacing: -.01em; text-align: left; border-radius: 8px; }
.tier-head .tier { width: 22px; height: 22px; font-size: 12px; border-radius: 6px; }
.tier-head .sub { font: 500 11px var(--mono); color: var(--fg2); margin-left: auto; font-variant-numeric: tabular-nums; }
.tier-head[aria-current="true"] { background: var(--raise); }
.tier-head:hover { background: var(--raise); }
.ch-item { height: 38px; padding: 0 12px; font-size: 13.5px; }
.ch-item .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-item .n { font: 11px var(--mono); color: var(--fg2); font-variant-numeric: tabular-nums; opacity: 0; }
.ch-item:hover .n, .ch-item[aria-current="true"] .n { opacity: 1; }
.av { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 700 10px var(--body); color: #fff; overflow: hidden; background: var(--fg2); }
.av.S { background: var(--tS); } .av.A { background: var(--tA); } .av.B { background: var(--tB); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.menu-btn { display: none; }
.scrim { display: none; }
.context { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.context .av { width: 52px; height: 52px; font-size: 16px; }
.context h2 { margin: 0; font: 800 24px/1.1 var(--display); letter-spacing: -.01em; }
.context p { margin: 2px 0 0; color: var(--fg2); font-size: 13px; }
.context .txt { flex: 1 1 200px; min-width: 0; }

.side-foot { display: flex; flex-direction: column; gap: 2px; padding: 0 4px; }
.side-foot a { color: var(--fg2); text-decoration: none; font-size: 13px; padding: 8px 8px; border-radius: 8px; }
.side-foot a:hover { background: var(--raise); color: var(--fg); }
.side-foot a:first-child { color: var(--accent); font-weight: 600; }

/* Cards: a clickable body plus a separate "save" button over the thumbnail */
.card { position: relative; min-width: 0; }
.card-hit { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 0; min-width: 0; }
.card:hover .thumb img { transform: scale(1.04); }
.later-btn { position: absolute; top: 6px; right: 6px; z-index: 1; width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgba(0,0,0,.72); color: #fff; display: grid; place-items: center; opacity: 0; transition: opacity .15s; }
.card:hover .later-btn, .later-btn:focus-visible, .later-btn[aria-pressed="true"] { opacity: 1; }
.later-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.rm-btn { position: absolute; top: 6px; right: 44px; z-index: 1; width: 32px; height: 32px; border-radius: 8px; border: 0; background: rgba(0,0,0,.72); color: #fff; font-size: 15px; display: grid; place-items: center; }
.rm-btn:hover { background: var(--tS); }
@media (hover: none) { .later-btn { opacity: .9; } }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.35); }
.prog i { display: block; height: 100%; background: var(--accent); }
.badge { position: absolute; left: 6px; top: 6px; font: 600 10.5px var(--mono); letter-spacing: .05em; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.75); color: #fff; }
.badge.new { background: var(--accent); color: var(--accent-fg); }
.badge.ts { top: auto; bottom: 6px; background: var(--accent); color: var(--accent-fg); }
.badge.step { background: var(--fg); color: var(--bg); font-size: 12px; }

/* Shelf: a horizontal row above the grid (Continue watching, transcript matches) */
.shelf { margin-bottom: 26px; }
.shelf h3 { margin: 0 0 12px; font: 700 17px var(--display); display: flex; align-items: baseline; gap: 10px; }
.shelf h3 small { font: 400 12px var(--body); color: var(--fg2); }
.shelf-row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 260px); gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }

/* Learning paths */
.paths { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; margin-bottom: 26px; }
.path-card { display: flex; flex-direction: column; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px; min-width: 0; }
.path-card:hover { border-color: var(--fg2); }
.path-card .mosaic { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; border-radius: 9px; overflow: hidden; aspect-ratio: 16/9; }
.path-card .mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.path-card h3 { margin: 2px 0 0; font: 700 18px var(--display); }
.path-card p { margin: 0; color: var(--fg2); font-size: 13px; }
.path-card .bar { height: 5px; border-radius: 99px; background: var(--raise); overflow: hidden; }
.path-card .bar i { display: block; height: 100%; background: var(--accent); }
.path-card .foot { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--fg2); font-variant-numeric: tabular-nums; }
.pathnav { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pathnav .txt { flex: 1 1 200px; min-width: 0; font-size: 13px; color: var(--fg2); }
.pathnav b { color: var(--fg); }
.up-label { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--fg2); margin: 4px 4px 8px; }
#upLabel { margin-top: 14px; }

.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 500; box-shadow: 0 8px 30px rgba(0,0,0,.25); }

main { padding-block: 20px 60px; min-width: 0; }
.layout > main { margin: 0; max-width: none; }
@media (max-width: 999px) {
  .layout { display: block; }
  .menu-btn { display: inline-flex; }
  .side { position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; height: auto; width: min(300px, 85vw); background: var(--bg); padding-top: max(14px, env(safe-area-inset-top, 0px)); transform: translateX(-102%); transition: transform .25s ease; }
  body.drawer .side { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.35); }
  body.drawer .scrim { display: block; position: fixed; inset: 0; z-index: 39; background: var(--shade); }
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px 16px; }
.thumb { position: relative; aspect-ratio: 16/9; max-width: 100%; border-radius: var(--r); overflow: hidden; background: var(--raise); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
.dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff; font: 500 11px var(--mono); padding: 2px 5px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.seen-badge { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.75); color: #fff; font: 500 11px var(--mono); padding: 2px 6px; border-radius: 4px; }
.card.seen .thumb img { opacity: .4; }
.card h3 { margin: 0; font-weight: 600; font-size: 14.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; gap: 6px; align-items: center; color: var(--fg2); font-size: 12.5px; min-width: 0; }
.meta .ch { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meta .dot::before { content: "·"; }
.meta .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty { padding: 60px 0; text-align: center; color: var(--fg2); }
.sentinel { height: 1px; }

/* Watch view: player + info on the left, "Up next" column on the right (stacks below 1000px) */
.watch { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
.watch-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding-block: max(10px, env(safe-area-inset-top, 0px)) 10px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.watch-bar .brand { margin-right: auto; }
.watch-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; padding-block: 20px 60px; max-width: 1680px; margin: 0 auto; }
.frame { aspect-ratio: 16/9; background: #000; width: 100%; border-radius: 12px; overflow: hidden; }
.frame iframe, .frame > div { width: 100%; height: 100%; border: 0; display: block; }
.pinfo h2 { margin: 14px 0 10px; font: 700 20px/1.3 var(--body); text-wrap: balance; }
.prow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.prow .who { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; border: 0; background: none; padding: 0; text-align: left; }
.prow .who .av { width: 40px; height: 40px; font-size: 13px; }
.prow .who b { display: block; font-size: 15px; }
.prow .who small { color: var(--fg2); font-size: 12.5px; }
.pstats { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: var(--raise); color: var(--fg2); font-size: 13px; font-variant-numeric: tabular-nums; }
.upnext-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.upnext-head h3 { margin: 0; font: 700 18px var(--display); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fg2); border: 0; background: none; padding: 0; }
.switch i { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .2s; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .2s; }
.switch[aria-checked="true"] i { background: var(--accent); }
.switch[aria-checked="true"] i::after { transform: translateX(14px); }
.up { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 10px; width: 100%; border: 0; background: none; padding: 4px; margin-bottom: 6px; text-align: left; border-radius: 10px; }
.up:hover { background: var(--raise); }
.up .thumb { border-radius: 8px; }
.up h4 { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.up .m { color: var(--fg2); font-size: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.up .m span { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up .tier { width: 16px; height: 16px; font-size: 10px; }
@media (max-width: 999px) { .watch-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 480px) { .up { grid-template-columns: 140px minmax(0, 1fr); } }

/* TV mode */
.tv { position: fixed; inset: 0; z-index: 60; background: #000; color: #fff; }
.tv .frame { position: absolute; inset: 0; aspect-ratio: auto; }
/* The HUD sits at the TOP so YouTube's own control bar (captions, settings, quality) at the bottom stays clickable. */
.tv .hot { position: absolute; left: 0; right: 0; top: 0; height: 96px; z-index: 1; }
.tv .hud { position: absolute; left: 0; right: 0; top: 0; z-index: 2; padding: max(18px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) 56px max(24px, env(safe-area-inset-left, 0px)); background: linear-gradient(rgba(0,0,0,.85), transparent); display: flex; align-items: start; gap: 10px 16px; transition: opacity .4s; flex-wrap: wrap; pointer-events: none; }
.tv .hud > * { pointer-events: auto; }
.tv.idle .hud { opacity: 0; }
.tv.idle .hud > * { pointer-events: none; }
.tv .hud .txt { flex: 1 1 300px; min-width: 0; }
.tv .hud .label { font: 500 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #f2a93b; }
.tv .hud h2 { margin: 4px 0 2px; font: 800 clamp(18px, 2.4vw, 30px)/1.15 var(--display); text-wrap: balance; }
.tv .hud p { margin: 0; color: #c7cdd8; }
.tv .hud .next { margin-top: 6px; font: 12px var(--mono); color: #9aa3b5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tv .hud .ctrls { display: flex; gap: 8px; flex-wrap: wrap; }
.tv .btn { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.25); color: #fff; }
.tv .btn:hover { background: rgba(255,255,255,.22); }
.tv .btn[aria-pressed="true"] { background: #f2a93b; border-color: #f2a93b; color: #171107; }

@media (max-width: 640px) {
  #surprise .lbl { display: none; }
  #surprise { width: 38px; padding: 0; justify-content: center; }
  .brand h1 { font-size: 22px; }
  .brand small { display: none; }
  .tabs button { padding: 0 11px; }
  .search kbd { display: none; }
  .grid { grid-template-columns: 1fr; }
}
/* Videos | Articles tabs */
.tabs { display: inline-flex; align-self: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--raise); }
.tabs button { height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font-weight: 600; font-size: 13px; color: var(--fg2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
body[data-mode="articles"] #tvBtn { display: none; }
.path-card .mosaic .mt { position: relative; overflow: hidden; }
.path-card .mosaic .mt img { position: absolute; inset: 0; }
.path-card .mosaic .ph { padding: 6px; }
.path-card .mosaic .ph b { font-size: 13px; }

/* Article cards: cover image (or a tile with the source name), title, short description */
.card-hit { color: inherit; text-decoration: none; }
.ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: #fff;
  background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.22), transparent 55%), var(--tB); }
.ph.S { background-color: var(--tS); } .ph.A { background-color: var(--tA); }
.ph b { font: 800 clamp(18px, 2vw, 24px)/1.1 var(--display); letter-spacing: -.01em; text-wrap: balance; text-shadow: 0 1px 8px rgba(0,0,0,.2); }
.thumb img { position: relative; }
.card .desc { margin: 0; color: var(--fg2); font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.art-acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.mini { height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 12px; color: var(--fg2); text-decoration: none; display: inline-flex; align-items: center; }
.mini:hover { color: var(--fg); border-color: var(--fg2); }
.av.fav { background: #fff; }
.av.fav img { width: 72%; height: 72%; object-fit: contain; }
.reads { margin-bottom: 18px; padding: 12px; border-radius: 12px; background: var(--raise); }
.reads h3 { margin: 0 0 10px; font: 700 16px var(--display); display: flex; align-items: baseline; gap: 8px; }
.reads h3 small { font: 400 12px var(--body); color: var(--fg2); }
.read-row { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px; border-radius: 8px; color: inherit; text-decoration: none; }
.read-row:hover { background: var(--surface); }
.read-row b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
.read-row small { color: var(--fg2); font-size: 12px; }
.mini.vids { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.context .lead { max-width: 760px; }

/* Curated paths: a course page with sections and annotated steps */
.paths-head { grid-column: 1 / -1; margin: 6px 0 -4px; font: 700 17px var(--display); display: flex; align-items: baseline; gap: 10px; }
.paths-head small { font: 400 12px var(--body); color: var(--fg2); }
.path-card .lvl, .context .lvl { align-self: flex-start; font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 5px; background: var(--fg); color: var(--bg); }
.course { max-width: 980px; }
.course-sec { margin: 0 0 26px; }
.course-sec h3 { margin: 0 0 10px; font: 700 18px var(--display); display: flex; align-items: baseline; gap: 10px; }
.course-sec h3 small { font: 400 12px var(--mono); color: var(--fg2); }
.step { display: grid; grid-template-columns: 30px 176px minmax(0, 1fr); gap: 14px; align-items: start; width: 100%; padding: 10px; border: 0; border-radius: 12px; background: none; text-align: left; color: inherit; text-decoration: none; }
.step:hover { background: var(--raise); }
.step .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); border: 1px solid var(--line); margin-top: 4px; }
.step.done .num { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.step .thumb { border-radius: 8px; }
.step .ph b { font-size: 14px; }
.step.done .thumb img { opacity: .45; }
.step h4 { margin: 2px 0 4px; font-size: 15px; font-weight: 600; line-height: 1.3; }
.step .why { margin: 0 0 6px; font-size: 13.5px; }
.step .m { color: var(--fg2); font-size: 12.5px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.kind { font: 600 10.5px var(--mono); letter-spacing: .05em; padding: 1px 6px; border-radius: 4px; background: var(--raise); color: var(--fg2); }
.step:hover .kind { background: var(--surface); }
@media (max-width: 640px) { .step { grid-template-columns: 26px 110px minmax(0, 1fr); gap: 10px; } .step .why { display: none; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const theme = store.get("theme", null);
if (theme) document.documentElement.dataset.theme = theme;
$("#themeBtn").onclick = () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("theme", next);
};

let CH = [], V = [], byId = new Map(), list = [], shown = 0;
let SIM = null, PATHS = [], SEARCH = null, searchLoading = null;
/* Two data sets share one UI. The globals (CH, V, byId, SIM, seen, later) point at the active one. */
let mode = "videos", LINKS = null, linksLoading = null, COURSES = [], courseCtx = null;
const DS = {
  videos:   { CH: [], V: [], byId: new Map(), SIM: null, PATHS: [], seen: new Set(store.get("seen", [])), later: store.get("later", []), seenKey: "seen", laterKey: "later", ready: null },
  articles: { CH: [], V: [], byId: new Map(), SIM: null, PATHS: [], seen: new Set(store.get("read", [])), later: store.get("readLater", []), seenKey: "read", laterKey: "readLater", ready: null },
};
let seen = DS.videos.seen, later = DS.videos.later;   // watched/read ids; saved ids, newest first
const saveSeen = () => store.set(DS[mode].seenKey, [...seen]);
const saveLater = () => { DS[mode].later = later; store.set(DS[mode].laterKey, later); };
const LBL = {
  videos:   { one: "video", many: "videos", src: "channels", seen: "watched", later: "Watch later", hide: "Hide watched", q: "Kubernetes, RAG, Terraform…",
              paths: "Learning paths", suggest: ["＋ Suggest a channel", "suggest-channel.yml"] },
  articles: { one: "article", many: "articles", src: "sources", seen: "read", later: "Read later", hide: "Hide read", q: "Distributed systems, Rust, LLMs…",
              paths: "Learning paths", suggest: ["＋ Suggest a blog", "suggest-blog.yml"] },
};
const L = () => LBL[mode];
let progress = store.get("progress", {});    // id -> { t: seconds watched, at: last watched (ms) }
const saveProgress = () => store.set("progress", progress);
const state = { q: "", view: "home", path: null, like: null, budget: 15, tier: null, topic: null, ch: null, dur: null, sort: "mix", hideSeen: false };
const TIERS = [["S", "Essential"], ["A", "Great"], ["B", "Worth a look"]];
const DURS = [["<10 min", 0, 600], ["10–30 min", 600, 1800], ["30–60 min", 1800, 3600], ["1 h+", 3600, 1e9]];
const ADURS = [["<5 min", 0, 300], ["5–15 min", 300, 900], ["15–30 min", 900, 1800], ["30 min+", 1800, 1e9]];
const durs = () => mode === "articles" ? ADURS : DURS;
const BUDGETS = [5, 10, 15, 20, 30, 45, 60];
const NOW = Date.now() / 1000, WEEK = 7 * 86400;
const isNew = v => v.ts && NOW - v.ts <= WEEK;

const fmtDur = s => { s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(ss).padStart(2, "0"); };
const fmtMin = s => { const m = Math.round(s / 60); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const fmtNum = n => n >= 1e9 ? (n / 1e9).toFixed(1) + "B" : n >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : n >= 1e3 ? Math.round(n / 1e3) + "K" : String(n);
const fmtAgo = ts => { if (!ts) return ""; const d = (Date.now() / 1000 - ts) / 86400;
  const ago = (n, u) => `${n} ${u}${n === 1 ? "" : "s"} ago`;
  if (d < 1) return "today"; if (d < 30) return ago(Math.round(d), "day");
  if (d < 365) return ago(Math.max(1, Math.round(d / 30)), "month"); return ago(Math.round(d / 365), "year"); };
const thumb = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const ICON_SAVE = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }

function chip(label, pressed, onclick, extra = "") {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", pressed);
  b.innerHTML = extra + esc(label); b.onclick = onclick; return b;
}
function toggle(key, val) { state[key] = state[key] === val ? null : val; renderFilters(); apply(); }

function renderFilters() {
  for (const id of ["topics", "durs"]) [...$("#" + id).querySelectorAll(".chip")].forEach(n => n.remove());
  for (const t of [...new Set(CH.map(c => c.topic))].sort()) $("#topics").append(chip(t, state.topic === t, () => toggle("topic", t)));
  durs().forEach(([l], i) => $("#durs").append(chip(l, state.dur === i, () => toggle("dur", i))));
  renderSide();
}

const initials = n => n.replace(/[^\p{L}\p{N} ]/gu, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase() || "?";
function avatar(c) {
  return `<span class="av ${c.t}${c.host ? " fav" : ""}" data-i="${esc(initials(c.n))}">${c.a ? `<img loading="lazy" referrerpolicy="no-referrer" alt="" src="${esc(c.a)}">` : esc(initials(c.n))}</span>`;
}
// Broken avatar URL -> fall back to the channel's initials
document.addEventListener("error", e => {
  const img = e.target; if (img.tagName !== "IMG") return;
  if (img.parentElement?.classList.contains("av")) { img.parentElement.classList.remove("fav"); img.parentElement.textContent = img.parentElement.dataset.i; }
  else if (img.closest(".card.art, .mosaic")) img.remove();   // broken cover image -> the source tile underneath shows
}, true);

function updateCounts() {
  const n = x => x ? x.toLocaleString("en-US") : "";
  $("#histN").textContent = n(seen.size);
  $("#laterN").textContent = n(later.filter(id => byId.has(id)).length);
  $("#newN").textContent = n(V.filter(isNew).length);
}
function renderSide() {
  const cur = state.view === "path" || state.view === "course" ? "paths" : state.view;
  document.querySelectorAll(".nav-item").forEach(b => b.setAttribute("aria-current", cur === b.dataset.view && state.ch == null && !state.tier));
  updateCounts();
  const box = $("#tierList"); box.innerHTML = "";
  for (const [t, label] of TIERS) {
    const chans = CH.map((c, i) => [c, i]).filter(([c]) => c.t === t && (!state.topic || c.topic === state.topic));
    if (!chans.length) continue;
    const head = document.createElement("button");
    head.type = "button"; head.className = "tier-head"; head.setAttribute("aria-current", state.tier === t && state.ch == null);
    head.innerHTML = `<span class="tier ${t}">${t}</span>${label}<span class="sub">${chans.length}</span>`;
    head.onclick = () => pick({ tier: state.tier === t && state.ch == null ? null : t, ch: null });
    box.append(head);
    for (const [c, i] of chans) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "ch-item"; b.title = c.subs != null ? `${c.n} · ${fmtNum(c.subs)} subscribers` : `${c.n} · ${c.host}`;
      b.setAttribute("aria-current", state.ch === i);
      b.innerHTML = `${avatar(c)}<span class="nm">${esc(c.n)}</span><span class="n">${c.subs != null ? fmtNum(c.subs) : ""}</span>`;
      b.onclick = () => pick({ ch: state.ch === i ? null : i, tier: null });
      box.append(b);
    }
  }
}
// Sidebar selection: set view/tier/channel, refresh, close the drawer on phones, jump to top
function pick(p) {
  Object.assign(state, { view: "home", path: null, like: null, course: null }, p);
  renderFilters(); apply(); setDrawer(false); scrollTo({ top: 0 }); syncHash();
}
document.querySelectorAll(".nav-item").forEach(b => b.onclick = () => pick({ view: b.dataset.view, tier: null, ch: null }));

/* ---------- Shareable links: #v=ID&t=SEC, #c=handle, #tier=S, #path=id, #time=15, #picks, #new, #paths, #later, #history ---------- */
// Articles views carry a leading "read": #read, #read&new, #read&c=dan-luu, #read&like=ID
function hashFor() {
  let h = "";
  if (state.ch != null) h = `c=${encodeURIComponent(CH[state.ch].h)}`;
  else if (state.tier) h = `tier=${state.tier}`;
  else if (state.view === "path") h = `path=${encodeURIComponent(state.path)}`;
  else if (state.view === "like") h = `like=${state.like}`;
  else if (state.view === "course") h = `course=${encodeURIComponent(state.course)}`;
  else if (state.view === "time") h = `time=${state.budget}`;
  else if (state.view !== "home") h = state.view;
  const parts = [mode === "articles" ? "read" : "", h].filter(Boolean);
  return parts.length ? "#" + parts.join("&") : "";
}
function syncHash() {
  if (!$("#watch").hidden) return;
  const h = hashFor();
  if (location.hash !== h) history.replaceState(null, "", h || location.pathname + location.search);
}
function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  const v = DS.videos.byId.get(p.get("v") || "");
  if (v) { setMode("videos"); openPlayer(v, { start: +p.get("t") || 0, fromRoute: true }); return; }
  if (!$("#watch").hidden) closePlayer(true);
  if (p.has("read")) { ensureArticles().then(() => { setMode("articles", { quiet: true }); routeView(p); }).catch(() => toast("Couldn't load articles")); return; }
  setMode("videos", { quiet: true }); routeView(p);
}
function routeView(p) {
  const next = { view: "home", path: null, like: null, tier: null, ch: null };
  if (p.get("c")) { const i = CH.findIndex(c => c.h.toLowerCase() === p.get("c").toLowerCase()); if (i >= 0) next.ch = i; }
  else if (p.get("tier") && TIERS.some(t => t[0] === p.get("tier").toUpperCase())) next.tier = p.get("tier").toUpperCase();
  // old automatic paths now live on as curated ones (same id, or renamed)
  else if (p.get("path")) { const id = { "neural-networks": "llms", networking: "internet" }[p.get("path")] || p.get("path");
    Object.assign(next, COURSES.some(c => c.id === id) ? { view: "course", course: id } : { view: "path", path: id }); }
  else if (p.get("like") && byId.has(p.get("like"))) Object.assign(next, { view: "like", like: p.get("like") });
  else if (p.get("course")) Object.assign(next, { view: "course", course: p.get("course") });

const slugify = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function passes(v, { ignoreSeen = false, ignoreQ = false } = {}) {
  const c = CH[v.c];
  if (state.tier && c.t !== state.tier) return false;
  if (state.topic && c.topic !== state.topic) return false;
  if (state.ch != null && v.c !== state.ch) return false;
  if (state.dur != null) { const [, lo, hi] = durs()[state.dur]; if (!v.d || v.d < lo || v.d >= hi) return false; }
  if (!ignoreSeen && state.hideSeen && seen.has(v.id)) return false;
  return ignoreQ || !state.q || v.s.includes(state.q);
}
// "I have X minutes": pack unwatched S/A videos (in a channel-balanced order) into the time budget
function packBudget() {
  const cap = state.budget * 60;
  const pool = mix(V.filter(v => passes(v) && !seen.has(v.id) && "SA".includes(CH[v.c].t) && v.d >= 60 && v.d <= cap && v.v >= (mode === "articles" ? 20 : 20000)));
  const out = []; let left = cap;
  for (const v of pool) { if (v.d <= left) { out.push(v); left -= v.d; } if (left < 90 || out.length >= 12) break; }
  return out;
}

function apply() {
  const by = { new: (a, b) => b.ts - a.ts, views: (a, b) => b.v - a.v, long: (a, b) => b.d - a.d };
  const sortList = () => { if (state.sort === "random") shuffle(list); else if (state.sort === "mix") list = mix(list); else list.sort(by[state.sort]); };
  const view = state.view;
  if (view === "history") { const order = [...seen]; list = V.filter(v => seen.has(v.id) && passes(v, { ignoreSeen: true })); list.sort((a, b) => order.lastIndexOf(b.id) - order.lastIndexOf(a.id)); }
  else if (view === "later") list = later.map(id => byId.get(id)).filter(v => v && passes(v, { ignoreSeen: true }));
  else if (view === "path") { const p = PATHS.find(p => p.id === state.path); list = (p?.videos || p?.articles || []).map(id => byId.get(id)).filter(Boolean); }
  else if (view === "paths" || view === "course") list = [];
  else if (view === "like") { const a = byId.get(state.like); list = a ? (SIM?.[a.i] || []).map(i => V[i]).filter(x => x && passes(x, { ignoreQ: true })) : []; }
  else if (view === "time") list = packBudget();
  else if (view === "new") { list = V.filter(v => isNew(v) && passes(v)); list.sort(by.new); }
  else if (view === "picks") {
    // Each Essential channel's 15 most-viewed videos, dealt out evenly so no channel dominates
    const per = new Map();
    for (const v of V.filter(v => CH[v.c].t === "S" && passes(v)).sort(by.views)) { const a = per.get(v.c) || []; if (a.length < 15) { a.push(v); per.set(v.c, a); } }
    list = [...per.values()].flat(); sortList();
  }
  else { list = V.filter(v => passes(v)); sortList(); }
  renderContext(); renderPaths(); renderCourse(); renderShelf();
  $("#count").textContent = `${list.length.toLocaleString("en-US")} / ${V.length.toLocaleString("en-US")} ${L().many} · ${CH.length} ${L().src}`;
  $("#grid").innerHTML = ""; shown = 0; more();

}
/* Channel-balanced shuffle: deal one video per channel per round, so a channel with 400 videos
   shows up as often as one with 40 until the smaller one runs out. */
function mix(arr) {
  const groups = new Map();
  for (const v of arr) { if (!groups.has(v.c)) groups.set(v.c, []); groups.get(v.c).push(v); }
  const decks = shuffle([...groups.values()].map(g => shuffle(g))), out = [];
  for (let round = 0; out.length < arr.length; round++)
    for (const d of shuffle(decks.filter(d => d.length > round))) out.push(d[round]);
  return out;
}

  // each tile has the source-name tile underneath, so a missing or broken image still looks right
  const tile = v => `<span class="mt">${v.art ? `<span class="ph ${v.ch.t}"><b>${esc(v.ch.n)}</b></span>${v.img ? `<img loading="lazy" alt="" referrerpolicy="no-referrer" src="${esc(v.img)}">` : ""}`
    : `<img loading="lazy" alt="" src="${thumb(v.id)}">`}</span>`;
  const LEVELS = ["Beginner", "Intermediate", "Advanced", "All levels"];
  const courses = [...COURSES].sort((a, b) => LEVELS.indexOf(a.level) - LEVELS.indexOf(b.level));
  let lastLevel = null;
  for (const c of courses) {
    if (c.level !== lastLevel) { lastLevel = c.level; box.insertAdjacentHTML("beforeend", `<div class="paths-head">${esc(c.level)}</div>`); }
    const items = courseItems(c), done = items.filter(isDone).length, mins = items.reduce((s, x) => s + x.d, 0);
    const b = document.createElement("button");
    b.type = "button"; b.className = "path-card";
    const cover = [...items.filter(x => !x.art), ...items.filter(x => x.art)].slice(0, 4);   // videos first, articles fill the rest
    b.innerHTML = `<div class="mosaic">${cover.map(tile).join("")}</div>
      <span class="lvl">${esc(c.level)}</span><h3>${esc(c.title)}</h3><p>${esc(c.blurb)}</p>
      <div class="bar"><i style="width:${items.length ? done / items.length * 100 : 0}%"></i></div>
      <div class="foot"><span>${items.length} steps · ${fmtMin(mins)}</span><span>${done}/${items.length} done</span></div>`;
    b.onclick = () => pick({ view: "course", course: c.id });
    box.append(b);
  }
  if (COURSES.length && PATHS.length) box.insertAdjacentHTML("beforeend", `<div class="paths-head">More paths <small>picked automatically, being replaced by curated ones</small></div>`);
  for (const p of PATHS) {
    const vids = (p.videos || p.articles || []).map(id => byId.get(id)).filter(Boolean);
    const done = vids.filter(v => seen.has(v.id)).length, total = vids.reduce((s, v) => s + v.d, 0);
    const b = document.createElement("button");
    b.type = "button"; b.className = "path-card";
    b.innerHTML = `<div class="mosaic">${vids.slice(0, 4).map(tile).join("")}</div>
      <h3>${esc(p.title)}</h3><p>${esc(p.blurb)}</p>
      <div class="bar"><i style="width:${vids.length ? done / vids.length * 100 : 0}%"></i></div>
      <div class="foot"><span>${vids.length} ${L().many} · ${fmtMin(total)}</span><span>${done}/${vids.length} ${L().seen}</span></div>`;
    b.onclick = () => pick({ view: "path", path: p.id });
    box.append(b);
  }
}

/* ---------- Curated paths ---------- */
// Steps point into both data sets; article steps resolve once the article data is loaded
const courseItems = c => !c ? [] : c.sections.flatMap(sec => sec.steps.map(st => (st.k === "v" ? DS.videos.byId : DS.articles.byId).get(st.id)).filter(Boolean));
const isDone = x => (x.art ? DS.articles.seen : DS.videos.seen).has(x.id);
function openStep(c, items, k) {
  const x = items[k]; if (!x) return;
  courseCtx = { c, items, i: k };
  if (x.art) { markRead(x); window.open(x.url, "_blank", "noopener"); apply(); }
  else { setMode("videos", { keepHash: true }); openPlayer(x, { course: courseCtx }); }
}
function renderCourse() {
  const box = $("#courseBox");
  box.hidden = state.view !== "course";
  if (box.hidden) return;
  const c = COURSES.find(x => x.id === state.course);
  if (!c) { box.innerHTML = ""; return; }
  if (!DS.articles.V.length) { box.innerHTML = `<p class="empty">Loading…</p>`; ensureArticles().then(apply).catch(() => {}); return; }
  const items = courseItems(c);
  let n = 0;
  box.innerHTML = c.sections.map(sec => {
    const rows = sec.steps.map(st => {
      const x = (st.k === "v" ? DS.videos.byId : DS.articles.byId).get(st.id); if (!x) return "";
      const k = n++, done = isDone(x);
      const th = x.art ? `<span class="ph ${x.ch.t}"><b>${esc(x.ch.n)}</b></span>${x.img ? `<img loading="lazy" alt="" referrerpolicy="no-referrer" src="${esc(x.img)}">` : ""}`
        : `<img loading="lazy" alt="" src="${thumb(x.id)}"><span class="dur">${fmtDur(x.d)}</span>`;
      const meta = x.art ? `<span class="kind">ARTICLE</span>${esc(x.ch.n)}${x.d ? " · " + readTime(x) : ""}${x.v ? ` · ▲ ${fmtNum(x.v)}` : ""}`
        : `<span class="kind">VIDEO</span>${esc(x.ch.n)} · ${fmtNum(x.v)} views`;
      return `<button type="button" class="step${done ? " done" : ""}" data-k="${k}"><span class="num">${done ? "✓" : k + 1}</span>
        <div class="thumb">${th}</div><div><h4>${esc(x.t)}</h4><p class="why">${esc(st.note)}</p><div class="m">${meta}</div></div></button>`;
    }).join("");
    const mins = sec.steps.reduce((s, st) => s + ((st.k === "v" ? DS.videos.byId : DS.articles.byId).get(st.id)?.d || 0), 0);
    return `<section class="course-sec"><h3>${esc(sec.title)} <small>${fmtMin(mins)}</small></h3>${rows}</section>`;
  }).join("");
  box.querySelectorAll(".step").forEach(b => b.onclick = () => openStep(c, items, +b.dataset.k));
}

/* ---------- Shelf: "Continue watching" on the home feed, transcript matches while searching ---------- */
let shelfToken = 0;
function renderShelf() {
  const token = ++shelfToken, box = $("#shelf");
  const show = (title, items) => {
    if (token !== shelfToken) return;
    $("#shelfRow").innerHTML = "";
    box.hidden = !items.length; if (!items.length) return;
    $("#shelfTitle").innerHTML = title;
    for (const [v, at] of items) $("#shelfRow").append(card(v, at != null ? { at } : {}));
  };
  if (mode === "articles") {
    const a = state.view === "like" && byId.get(state.like);
    if (!a) return show("", []);
    box.hidden = true;
    ensureLinks().then(() => show(`Watch on this topic <small>videos from Nerdvana</small>`,
      linksOk() ? (LINKS.a2v[a.i] || []).map(i => [DS.videos.V[i], null]).filter(([v]) => v) : []));
    return;
  }
  if (state.q.length >= 3 && !["paths", "path", "time"].includes(state.view)) {
    box.hidden = true;
    ensureSearch().then(() => show(`Mentioned in transcripts <small>spoken in the video, jumps to the moment</small>`, transcriptHits(state.q)));
    return;
  }
  const home = state.view === "home" && state.ch == null && !state.tier && !state.topic && state.dur == null;
  if (home) {
    const items = Object.entries(progress).sort((a, b) => b[1].at - a[1].at).map(([id, p]) => [byId.get(id), null]).filter(([v]) => v && !seen.has(v.id)).slice(0, 12);
    return show(`Continue watching <small>picks up where you left off</small>`, items);
  }
  show("", []);
}
function ensureSearch() {
  return searchLoading ||= fetch("search.json").then(r => r.ok ? r.json() : null)
    .then(d => { if (d) { SEARCH = d; SEARCH.keys = Object.keys(d.terms); } }).catch(() => {});
}
// Videos whose transcript mentions the query words, best first: most words matched, then most viewed.
// Exact word first, otherwise any indexed word starting with it ("kube" -> "kubernetes"). Short/common words are ignored.
const QSTOP = new Set("the and for with what how why who are was this that from into you your about does not can its".split(" "));
function transcriptHits(q) {
  const words = [...new Set(q.split(/[^a-z0-9+#.-]+/).filter(w => w.length >= 3 && !QSTOP.has(w)))];
  if (!SEARCH || !words.length) return [];
  const docs = new Map();   // doc -> { n: words matched, s: second where the first matched word is spoken }
  for (const w of words) {
    let posts = SEARCH.terms[w];
    if (!posts) { posts = []; for (const k of SEARCH.keys) if (k.length > w.length && k.startsWith(w)) posts = posts.concat(SEARCH.terms[k]); }
    const m = new Map();
    for (const [d, s] of posts) if (!m.has(d) || s < m.get(d)) m.set(d, s);
    for (const [d, s] of m) { const e = docs.get(d); docs.set(d, e ? { n: e.n + 1, s: Math.min(e.s, s) } : { n: 1, s }); }
  }
  const need = words.length > 2 ? words.length - 1 : words.length;   // allow one missing word in longer queries
  return [...docs].filter(([, e]) => e.n >= need).map(([d, e]) => [byId.get(SEARCH.docs[d]), e.s, e.n])
    .filter(([v]) => v && passes(v, { ignoreQ: true })).sort((a, b) => b[2] - a[2] || b[0].v - a[0].v).slice(0, 30).map(([v, s]) => [v, s]);
}

/* ---------- Watch view ---------- */
let current = null, nextUp = null, wp = null, autoplay = store.get("autoplay", true);
function upItem(u) {
  const uc = CH[u.c], b = document.createElement("button");
  b.type = "button"; b.className = "up";
  b.innerHTML = `<div class="thumb"><img loading="lazy" alt="" src="${thumb(u.id)}">${u.d ? `<span class="dur">${fmtDur(u.d)}</span>` : ""}${seen.has(u.id) ? `<span class="badge">WATCHED</span>` : ""}</div>
    <div class="m"><h4>${esc(u.t)}</h4><span>${esc(uc.n)} <span class="tier ${uc.t}">${uc.t}</span></span><span>${fmtNum(u.v)} views</span></div>`;
  b.onclick = () => openPlayer(u, { start: progress[u.id]?.t || 0 });
  return b;
}
function openPlayer(v, o = {}) {
  saveCurrentProgress();
  current = v;
  const inPath = state.view === "path" && list.includes(v);
  // More like this: nearest titles by meaning (precomputed), skipping this video
  const sim = (SIM?.[v.i] || []).map(i => V[i]).filter(x => x && x !== v).slice(0, 8);
  // From your feed: what follows this video in the current list, else a fresh channel-balanced mix
  const idx = list.indexOf(v);
  const pool = idx >= 0 ? [...list.slice(idx + 1), ...(inPath ? [] : list.slice(0, idx))] : mix(list.length ? [...list] : [...V]);
  const simSet = new Set(sim);
  let feed = pool.filter(x => x !== v && !simSet.has(x) && (inPath || !seen.has(x.id))).slice(0, inPath ? 20 : 12);
  if (!inPath && feed.length < 12) feed.push(...pool.filter(x => x !== v && !simSet.has(x) && seen.has(x.id)).slice(0, 12 - feed.length));
  nextUp = inPath ? feed[0] : ([...sim, ...feed].find(x => !seen.has(x.id)) || feed[0] || sim[0]);

  const c = CH[v.c];
  $("#pTitle").textContent = v.t;
  $("#pWho").innerHTML = `${avatar(c)}<span><b>${esc(c.n)}</b><small>${fmtNum(c.subs)} subscribers</small></span>`;
  $("#pStats").textContent = `${v.v.toLocaleString("en-US")} views · ${fmtAgo(v.ts)} · ${fmtDur(v.d)} · ${TIERS.find(x => x[0] === c.t)[1]} tier · ${c.topic}`;
  $("#pYt").href = `https://www.youtube.com/watch?v=${v.id}`;
  $("#pSeen").textContent = seen.has(v.id) ? "Mark unwatched" : "Mark watched";
  renderLaterBtn();
  const pn = $("#pathNav"); pn.hidden = !inPath;
  if (inPath) { const p = PATHS.find(x => x.id === state.path);
    pn.innerHTML = `<div class="txt">Step <b>${idx + 1} of ${list.length}</b> in <b>${esc(p.title)}</b></div>${feed[0] ? `<button class="btn primary" type="button" id="pathNext">Next step →</button>` : `<span class="txt"><b>Last step 🎉</b></span>`}`;
    $("#pathNext")?.addEventListener("click", () => openPlayer(feed[0]));
  }
  // Curated path: keep the context while moving through its steps, drop it otherwise
  if (o.course) courseCtx = o.course;
  if (courseCtx) { const k = courseCtx.items.indexOf(v); if (k >= 0) courseCtx.i = k; else courseCtx = null; }
  if (courseCtx) { const nx = courseCtx.items[courseCtx.i + 1]; if (nx && !nx.art) nextUp = nx; renderCourseNav(); }
  renderReads(v);
  $("#simLabel").hidden = !sim.length || inPath; $("#simList").innerHTML = "";
  if (!inPath) sim.forEach(u => $("#simList").append(upItem(u)));
  $("#upLabel").hidden = !sim.length || inPath; $("#upLabel").textContent = "From your feed";
  $("#upList").innerHTML = ""; feed.forEach(u => $("#upList").append(upItem(u)));

  const wasHidden = $("#watch").hidden;
  $("#watch").hidden = false; document.body.style.overflow = "hidden";
  if (!wasHidden) $("#watch").scrollTo({ top: 0 });
  const h = `#v=${v.id}`;
  if (o.fromRoute || !wasHidden) history.replaceState({ watch: 1 }, "", h); else history.pushState({ watch: 1 }, "", h);

  if (o.keepPlayer) return;
  let start = Math.floor(o.start || 0); if (start > v.d - 20) start = 0;
  loadYT().then(() => {
    if (current !== v) return;
    if (wp) wp.loadVideoById({ videoId: v.id, startSeconds: start });
    else wp = new YT.Player("wPlayer", { videoId: v.id, playerVars: { autoplay: 1, rel: 0, modestbranding: 1, start },
      events: { onReady: e => e.target.playVideo(),
                onStateChange: e => { if (e.data === YT.PlayerState.ENDED && current) { finish(current.id); if (autoplay && nextUp) openPlayer(nextUp); } } } });
  });
}
// "Read more about this": articles on the same topic (loads the article data the first time)
function renderReads(v) {
  const box = $("#reads"); box.hidden = true; box.innerHTML = "";
  Promise.all([ensureArticles(), ensureLinks()]).then(() => {
    if (current !== v || !linksOk()) return;
    const arts = (LINKS.v2a[v.i] || []).map(i => DS.articles.V[i]).filter(Boolean);
    if (!arts.length) return;
    box.innerHTML = `<h3>Read about this <small>from the Articles tab</small></h3>` + arts.map(a => `<a class="read-row" href="${esc(a.url)}" target="_blank" rel="noopener" data-id="${a.id}">
      ${avatar(a.ch)}<span><b>${esc(a.t)}</b><small>${esc(a.ch.n)}${a.d ? " · " + readTime(a) : ""}${a.v ? " · ▲ " + fmtNum(a.v) : ""}</small></span></a>`).join("");
    box.querySelectorAll("a").forEach(el => el.onclick = () => markRead(DS.articles.byId.get(el.dataset.id)));
    box.hidden = false;
  }).catch(() => {});
}
function renderCourseNav() {
  const pn = $("#pathNav"), { c, items, i } = courseCtx, nx = items[i + 1];
  pn.hidden = false;
  pn.innerHTML = `<div class="txt">Step <b>${i + 1} of ${items.length}</b> in <b>${esc(c.title)}</b>${nx ? ` · next: ${nx.art ? "read" : "watch"} <b>${esc(nx.t)}</b>` : ""}</div>
    ${nx ? (nx.art ? `<a class="btn primary" id="courseNext" href="${esc(nx.url)}" target="_blank" rel="noopener">Read next step ↗</a>` : `<button class="btn primary" type="button" id="courseNext">Next step →</button>`)
         : `<span class="txt"><b>Last step 🎉</b></span>`}`;
  $("#courseNext")?.addEventListener("click", () => {
    if (nx.art) { markRead(nx); courseCtx.i++; renderCourseNav(); }   // after reading, offer the step after it
    else openPlayer(nx);
  });
}
function closePlayer(fromPop) {
  saveCurrentProgress();
  $("#watch").hidden = true; document.body.style.overflow = ""; wp?.stopVideo?.(); current = null;
  renderSide(); renderShelf();
  if (fromPop !== true) { if (history.state?.watch) history.back(); else syncHash(); }
}
function markSeen(id, on) {
  on ? seen.add(id) : seen.delete(id); saveSeen();
  if (on) { delete progress[id]; saveProgress(); }
  document.querySelectorAll(`.card[data-id="${id}"]`).forEach(el => el.classList.toggle("seen", on));
  updateCounts();
}
function finish(id) { markSeen(id, true); }
// Remember the playback position every few seconds, so "Continue watching" can resume it
function saveCurrentProgress() {
  if (!current || !wp?.getCurrentTime) return;
  const t = Math.floor(wp.getCurrentTime() || 0), id = current.id;
  if (t >= current.d * 0.92 && current.d) { if (!seen.has(id)) markSeen(id, true); return; }
  if (t > 15) { progress[id] = { t, at: Date.now() }; saveProgress(); }
}
setInterval(() => { if (current && wp?.getPlayerState?.() === 1) saveCurrentProgress(); }, 5000);
$("#pClose").onclick = () => closePlayer();
$("#pWho").onclick = () => { if (!current) return; const i = current.c; closePlayer(true); pick({ ch: i, tier: null }); };
$("#pSeen").onclick = () => { if (!current) return; const on = !seen.has(current.id); markSeen(current.id, on); $("#pSeen").textContent = on ? "Mark unwatched" : "Mark watched"; };
$("#pLater").onclick = () => current && toggleLater(current.id);
$("#pShare").onclick = async () => {
  if (!current) return;
  const t = Math.floor(wp?.getCurrentTime?.() || 0);
  const url = `${location.origin}${location.pathname}#v=${current.id}${t > 5 ? `&t=${t}` : ""}`;
  try { await navigator.clipboard.writeText(url); toast(t > 5 ? `Link copied, starts at ${fmtDur(t)}` : "Link copied"); }
  catch { toast(url); }
};
function renderAuto() { $("#autoBtn").setAttribute("aria-checked", autoplay); }
$("#autoBtn").onclick = () => { autoplay = !autoplay; store.set("autoplay", autoplay); renderAuto(); };
renderAuto();

/* Surprise me: a random unwatched video from the current filter (or from everything if the filter is empty) */
function surprise() {
  const pool = (list.length ? list : V).filter(v => !seen.has(v.id));
  const from = pool.length ? pool : (list.length ? list : V);
  const v = from[Math.random() * from.length | 0];
  if (!v) return;
  if (v.art) { markRead(v); window.open(v.url, "_blank", "noopener"); } else openPlayer(v);
}

/* TV mode: plays the current filtered list as a channel-balanced mix, unwatched first (or a given queue in order) */
let yt = null, ytReady = null, queue = [], qi = 0, idleT;
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise(res => { window.onYouTubeIframeAPIReady = res; });
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.append(s);
  return ytReady;
}
async function startTV(fixed) {
  if (Array.isArray(fixed)) queue = fixed;
  else { const pool = list.length ? list : V;
    queue = [...mix(pool.filter(v => !seen.has(v.id))), ...mix(pool.filter(v => seen.has(v.id)))]; }
  qi = 0;
  if (!queue.length) return;
  if (!$("#watch").hidden) closePlayer();
  $("#tv").hidden = false; document.documentElement.requestFullscreen?.().catch(() => {});
  $("#tvLabel").textContent = `TV mode · ${queue.length.toLocaleString("en-US")} videos queued`;
  await loadYT();
  if (!yt) yt = new YT.Player("tvPlayer", { videoId: queue[0].id,
    playerVars: { autoplay: 1, rel: 0, modestbranding: 1, cc_load_policy: cc ? 1 : 0, cc_lang_pref: "en" },
    events: { onReady: e => e.target.playVideo(),
              onStateChange: e => {
                if (e.data === YT.PlayerState.PLAYING) applyCC();
                if (e.data === YT.PlayerState.ENDED) { markSeen(queue[qi].id, true); step(1); } },
              onError: () => step(1) } });
  else yt.loadVideoById(queue[0].id);
  hud(); poke();
}
function step(d) { qi = Math.max(0, Math.min(queue.length - 1, qi + d)); yt?.loadVideoById(queue[qi].id); hud(); poke(); }
function hud() {
  const v = queue[qi], c = CH[v.c], n = queue[qi + 1];
  $("#tvTitle").textContent = v.t;
  $("#tvMeta").textContent = `${c.n} · ${fmtDur(v.d)} · ${fmtNum(v.v)} views`;
  $("#tvNext").textContent = n ? `Up next: ${n.t}` : "End of queue";
}
function stopTV() { $("#tv").hidden = true; yt?.stopVideo(); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }
function poke() { $("#tv").classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => $("#tv").classList.add("idle"), 3000); }
/* Captions: off by default, choice remembered. Re-applied on every video since YouTube may turn them back on. */
let cc = store.get("cc", false);
function applyCC() {
  if (!yt?.loadModule) return;
  try { if (cc) { yt.loadModule("captions"); yt.setOption("captions", "track", { languageCode: "en" }); }
        else { yt.setOption("captions", "track", {}); yt.unloadModule("captions"); } } catch {}
}
function renderCC() { $("#tvCC").setAttribute("aria-pressed", cc); $("#tvCC").textContent = cc ? "CC Subtitles: On" : "CC Subtitles: Off"; }
function toggleCC() { cc = !cc; store.set("cc", cc); renderCC(); applyCC(); }
renderCC();
$("#tvCC").onclick = toggleCC;
$("#tvBtn").onclick = () => startTV(); $("#surprise").onclick = surprise; $("#surprise2").onclick = surprise; $("#tvExit").onclick = stopTV;
$("#tvSkip").onclick = () => step(1); $("#tvPrev").onclick = () => step(-1);
$("#tv").addEventListener("mousemove", poke);
$("#tvHot").addEventListener("mousemove", poke);

document.addEventListener("keydown", e => {
  if (!$("#tv").hidden) {
    if (e.key === "Escape") stopTV(); else if (e.key === "ArrowRight" || e.key === "n") step(1); else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "c") toggleCC();
    poke(); return;
  }
  if (!$("#watch").hidden) { if (e.key === "Escape") closePlayer(); return; }
  if (e.key === "Escape" && document.body.classList.contains("drawer")) return setDrawer(false);
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
window.addEventListener("pagehide", saveCurrentProgress);

let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { state.q = norm(e.target.value.trim()); renderFilters(); apply(); }, 150); });
$("#sort").onchange = e => { state.sort = e.target.value; apply(); };
$("#hideSeen").onclick = e => { state.hideSeen = !state.hideSeen; e.currentTarget.setAttribute("aria-pressed", state.hideSeen); renderFilters(); apply(); };

// A shared #read link: start loading the articles right away and don't flash the video feed first
const startOnArticles = /^#read\b/.test(location.hash);
if (startOnArticles) { $("#count").textContent = "loading articles…"; ensureArticles().catch(() => {}); }
Promise.all([
  fetch("videos.json").then(r => r.json()),
  fetch("paths.json").then(r => r.ok ? r.json() : []).catch(() => []),
  fetch("courses.json").then(r => r.ok ? r.json() : []).catch(() => []),
]).then(([d, paths, courses]) => {
  COURSES = courses;
  CH = d.channels; PATHS = paths; DS.videos.PATHS = paths;
  V = d.videos.map(([id, t, c, dur, v, ts], i) => ({ i, id, t, c, ch: CH[c], d: dur, v, ts, s: norm(t + " " + d.channels[c].n) }));
  byId = new Map(V.map(v => [v.id, v]));
  Object.assign(DS.videos, { CH, V, byId });
  if (!startOnArticles) { renderFilters(); apply(); }
  route();
  // "More like this" data is only valid for the exact videos.json it was built from
  fetch("similar.json").then(r => r.ok ? r.json() : null)
    .then(s => { if (s && s.n === DS.videos.V.length && s.first === DS.videos.V[0].id) { DS.videos.SIM = s.sim; if (mode === "videos") SIM = s.sim; if (current) openPlayer(current, { fromRoute: true, keepPlayer: true }); } })
    .catch(() => {});
